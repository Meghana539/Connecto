<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 1. Page Background - Subtle color to contrast the white box */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f0ff; /* Soft Lavender */
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* 2. The "Box" - Medium Width (650px) */
        .profile-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(106, 27, 154, 0.1);
            border-left: 8px solid #6a1b9a; /* Bold Color Strip on the side */
            position: relative;
        }

        h2 {
            color: #4a148c;
            margin-top: 0;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 3. Colorful Profile Header */
        .photo-section {
            background: linear-gradient(to right, #f8f4ff, #ffffff);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #d1c4e9;
        }

        #id_profile_photo { display: none; }

        .photo-label {
            position: relative;
            cursor: pointer;
        }

        .img-preview {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            outline: 3px solid #7b1fa2;
            transition: all 0.3s ease;
        }

        .img-preview:hover {
            outline-offset: 4px;
            transform: rotate(3deg);
        }

        /* 4. Form Styling with Color Accents */
        form p {
            margin-bottom: 22px;
        }

        form p label {
            display: block;
            font-weight: 700;
            color: #6a1b9a; /* Purple Labels */
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        /* Hide the default Django file label */
        form p label[for="id_profile_photo"] { display: none; }

        form input[type="text"],
        form input[type="email"],
        form input[type="number"],
        form select,
        form textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        /* 5. Colorful Focus State */
        form input:focus {
            outline: none;
            border-color: #7b1fa2;
            background-color: #fdfbff;
            box-shadow: 0 0 0 4px rgba(123, 31, 162, 0.1);
        }

        /* 6. High-Contrast Submit Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #6a1b9a 0%, #4a148c 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(74, 20, 140, 0.3);
            transition: transform 0.2s, hover 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #7b1fa2 0%, #6a1b9a 100%);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="profile-card">
    <h2>Edit Profile</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="photo-section">
            <label for="id_profile_photo" class="photo-label">
                {% if form.instance.profile_photo %}
                    <img src="{{ form.instance.profile_photo.url }}" class="img-preview" id="preview">
                {% else %}
                    <div class="img-preview" style="background: #eee; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #7b1fa2;" id="preview">+</div>
                {% endif %}
            </label>
            <input type="file" name="profile_photo" id="id_profile_photo" onchange="previewFile(event)">
        </div>

        {{ form.as_p }}

        <button type="submit" class="btn-submit">Save Profile Settings</button>
    </form>
</div>

<script>
    function previewFile(event) {
        var reader = new FileReader();
        reader.onload = function(){
            var output = document.getElementById('preview');
            // If it's the placeholder div, we replace it with an img tag
            if(output.tagName === 'DIV') {
                const img = document.createElement('img');
                img.className = 'img-preview';
                img.id = 'preview';
                img.src = reader.result;
                output.parentNode.replaceChild(img, output);
            } else {
                output.src = reader.result;
            }
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>

</body>
</html>
