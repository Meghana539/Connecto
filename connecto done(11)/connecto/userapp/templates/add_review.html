<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Service | Connecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0; display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Poppins', sans-serif; padding: 20px;
        }

        .rating-card {
            background: #ffffff; padding: 40px; border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%;
            max-width: 450px; text-align: center; transition: transform 0.3s ease;
        }

        .provider-avatar {
            width: 80px; height: 80px; background: linear-gradient(135deg, #6c63ff, #8a82f7);
            color: white; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 32px; margin: 0 auto 20px;
            font-weight: bold; box-shadow: 0 5px 15px rgba(108, 99, 255, 0.3);
        }

        /* ⭐ INTERACTIVE STARS */
        .star-rating {
            display: flex; flex-direction: row-reverse; justify-content: center;
            gap: 12px; margin: 20px 0 10px;
        }

        .star-rating input { display: none; }
        .star-rating label { font-size: 45px; color: #ddd; cursor: pointer; transition: 0.2s; }

        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label { color: #ffb800; }

        #ratingFeedback { font-size: 14px; font-weight: 600; color: #6c63ff; margin-bottom: 20px; min-height: 21px; }

        .form-control { border-radius: 12px; border: 2px solid #f0f2f5; padding: 12px; font-size: 14px; }
        .form-control:focus { box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1); border-color: #6c63ff; }

        .submit-btn {
            background: linear-gradient(135deg, #6c63ff, #8a82f7); border: none;
            padding: 15px; border-radius: 12px; font-weight: 600; color: white;
            width: 100%; margin-top: 10px; transition: 0.3s;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(108, 99, 255, 0.3); color: white; }

        .skip-link { display: block; margin-top: 20px; color: #888; font-size: 13px; text-decoration: none; }
    </style>
</head>
<body>

<div class="rating-card shadow-lg">
    <div class="provider-avatar">
        {{ booking.provider.user.first_name|slice:":1"|upper }}
    </div>

    <h4 class="fw-bold">Rate Your Experience</h4>
    <p class="text-muted small">How was the service provided by<br><b>{{ booking.provider.user.get_full_name }}</b>?</p>

    <form method="post" id="ratingForm">
        {% csrf_token %}

        <div class="star-rating">
            <input type="radio" name="rating" id="star5" value="5" required><label for="star5" class="bx bxs-star"></label>
            <input type="radio" name="rating" id="star4" value="4"><label for="star4" class="bx bxs-star"></label>
            <input type="radio" name="rating" id="star3" value="3"><label for="star3" class="bx bxs-star"></label>
            <input type="radio" name="rating" id="star2" value="2"><label for="star2" class="bx bxs-star"></label>
            <input type="radio" name="rating" id="star1" value="1"><label for="star1" class="bx bxs-star"></label>
        </div>

        <div id="ratingFeedback">Select Stars</div>

        <div class="mb-4 text-start">
            <label class="small fw-bold text-muted mb-2 text-uppercase" for="comment">Your Review (Optional)</label>
            <textarea name="comment" id="comment" class="form-control" rows="3" placeholder="Tell us about the quality of work..."></textarea>
        </div>

        <button type="submit" class="btn submit-btn">
            Submit Feedback <i class='bx bx-paper-plane ms-1'></i>
        </button>


    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('ratingForm');
        const ratingInputs = document.querySelectorAll('.star-rating input');
        const feedbackText = document.getElementById('ratingFeedback');

        const feedbacks = {
            '1': 'Poor 😞',
            '2': 'Fair 😐',
            '3': 'Good 😊',
            '4': 'Very Good 😄',
            '5': 'Excellent! 😍'
        };

        // Star Selection Feedback Logic
        ratingInputs.forEach(input => {
            input.addEventListener('change', function() {
                if (this.checked) {
                    feedbackText.textContent = feedbacks[this.value];
                    feedbackText.style.opacity = 0;
                    setTimeout(() => { feedbackText.style.opacity = 1; }, 100);
                }
            });
        });

        // ⭐ SWEETALERT POPUP LOGIC
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            Swal.fire({
                title: 'Thank You! ⭐',
                text: 'Your feedback has been received.',
                icon: 'success',
                showConfirmButton: false,
                timer: 1500,
                timerProgressBar: true,
                willClose: () => {
                    form.submit(); // Popup khatam hone ke baad hi form submit hoga
                }
            });
        });
    });
</script>

</body>
</html>
